<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Kiln</title>
<style>
  :root {
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
  }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #100e0c;
    color: #f4efe6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100dvh;
    display: block;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const BEST_KEY = "kiln-best-v1";

  const BLOCK_H = 36;
  const BASE_W_RATIO = 0.46;
  const PERFECT = 4;
  const MIN_W = 8;

  let dpr = 1;
  let W = 0;
  let H = 0;
  let safeTop = 0;
  let safeBottom = 0;

  let mode = "title"; // title | play | over
  let stack = [];
  let mover = null;
  let shards = [];
  let score = 0;
  let best = 0;
  let flash = 0;
  let shake = 0;
  let last = 0;
  let audioOn = false;
  let actx = null;

  try { best = Number(localStorage.getItem(BEST_KEY)) || 0; } catch (e) {}

  function resize() {
    var box = window.visualViewport;
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    W = Math.round(Math.max(window.innerWidth || 0, document.documentElement.clientWidth || 0, (box && box.width) || 0));
    H = Math.round(Math.max(window.innerHeight || 0, document.documentElement.clientHeight || 0, (box && box.height) || 0));
    canvas.style.position = "fixed";
    canvas.style.top = "0";
    canvas.style.left = "0";
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const s = getComputedStyle(document.documentElement);
    safeTop = parseFloat(s.getPropertyValue("--sat")) || 0;
    safeBottom = 0;
  }

  function tone(freq, dur, type, gain) {
    if (!audioOn || !actx) return;
    const t = actx.currentTime;
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g);
    g.connect(actx.destination);
    o.start(t);
    o.stop(t + dur);
  }

  function unlockAudio() {
    if (audioOn) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();
    audioOn = true;
    if (actx.state === "suspended") actx.resume();
  }

  function colorAt(i) {
    const hue = (24 + i * 11) % 360;
    return {
      fill: "hsl(" + hue + " 62% 48%)",
      lite: "hsl(" + hue + " 80% 68%)",
      dark: "hsl(" + hue + " 50% 28%)"
    };
  }

  function baseWidth() {
    return Math.min(220, W * BASE_W_RATIO);
  }

  function reset() {
    const w = baseWidth();
    const x = (W - w) / 2;
    stack = [{ x: x, w: w, i: 0 }];
    score = 0;
    flash = 0;
    shake = 0;
    shards = [];
    spawn(w, x, 1);
    mode = "play";
  }

  function spawn(w, x, i) {
    const speed = Math.min(520, 180 + score * 14);
    const dir = Math.random() < 0.5 ? -1 : 1;
    mover = { x: dir < 0 ? W - w - 8 : 8, w: w, i: i, dir: dir, speed: speed, fromX: x };
  }

  function drop() {
    if (mode !== "play" || !mover) return;
    const prev = stack[stack.length - 1];
    const left = Math.max(mover.x, prev.x);
    const right = Math.min(mover.x + mover.w, prev.x + prev.w);
    const overlap = right - left;

    if (overlap < MIN_W) {
      shards.push({
        x: mover.x, y: topY() - BLOCK_H - 2, w: mover.w, h: BLOCK_H,
        vx: mover.dir * 40, vy: 0, rot: 0, vr: mover.dir * 2,
        c: colorAt(mover.i)
      });
      tone(110, 0.35, "sawtooth", 0.08);
      shake = 10;
      mode = "over";
      mover = null;
      if (score > best) {
        best = score;
        try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {}
      }
      return;
    }

    const perfect = Math.abs(mover.x - prev.x) <= PERFECT;
    const placedX = perfect ? prev.x : left;
    const placedW = perfect ? prev.w : overlap;

    if (!perfect) {
      const cutLeft = placedX > mover.x;
      const cutW = mover.w - overlap;
      const cutX = cutLeft ? mover.x : placedX + placedW;
      shards.push({
        x: cutX, y: topY() - BLOCK_H - 2, w: cutW, h: BLOCK_H,
        vx: cutLeft ? -90 : 90, vy: -20, rot: 0, vr: cutLeft ? -3 : 3,
        c: colorAt(mover.i)
      });
      tone(180 + score * 3, 0.08, "square", 0.04);
    } else {
      flash = 1;
      tone(520, 0.09, "triangle", 0.06);
      tone(780, 0.12, "sine", 0.04);
    }

    stack.push({ x: placedX, w: placedW, i: mover.i });
    score += 1;
    spawn(placedW, placedX, mover.i + 1);
  }

  function topY() {
    return H * 0.62;
  }

  function roundRect(x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  function drawBlock(x, y, w, h, c, alpha) {
    ctx.globalAlpha = alpha;
    ctx.fillStyle = c.dark;
    roundRect(x, y + 3, w, h, 6);
    ctx.fill();
    const g = ctx.createLinearGradient(x, y, x, y + h);
    g.addColorStop(0, c.lite);
    g.addColorStop(0.45, c.fill);
    g.addColorStop(1, c.dark);
    ctx.fillStyle = g;
    roundRect(x, y, w, h - 2, 6);
    ctx.fill();
    ctx.globalAlpha = alpha * 0.45;
    ctx.fillStyle = "#fff";
    roundRect(x + 6, y + 4, Math.max(0, w - 12), 6, 3);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#1a1410");
    g.addColorStop(0.55, "#12100e");
    g.addColorStop(1, "#0c0b0a");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 0.15;
    ctx.strokeStyle = "#e7b56a";
    ctx.lineWidth = 1;
    for (let x = 24; x < W; x += 28) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, H);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function label(text, y, size, weight, color, alpha) {
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    ctx.fillStyle = color || "#f4efe6";
    ctx.font = (weight || 600) + " " + size + "px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(text, W / 2, y);
    ctx.globalAlpha = 1;
  }

  function frame(ts) {
    var box = window.visualViewport;
    var liveW = Math.round(Math.max(window.innerWidth || 0, document.documentElement.clientWidth || 0, (box && box.width) || 0));
    var liveH = Math.round(Math.max(window.innerHeight || 0, document.documentElement.clientHeight || 0, (box && box.height) || 0));
    if (liveW !== W || liveH !== H) resize();
    const dt = Math.min(0.033, (ts - last) / 1000 || 0.016);
    last = ts;

    if (mode === "play" && mover) {
      mover.x += mover.dir * mover.speed * dt;
      if (mover.x <= 6) { mover.x = 6; mover.dir = 1; }
      if (mover.x + mover.w >= W - 6) { mover.x = W - 6 - mover.w; mover.dir = -1; }
    }

    for (let i = shards.length - 1; i >= 0; i--) {
      const s = shards[i];
      s.vy += 1400 * dt;
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.rot += s.vr * dt;
      if (s.y > H + 80) shards.splice(i, 1);
    }
    if (flash > 0) flash = Math.max(0, flash - dt * 2.2);
    if (shake > 0) shake = Math.max(0, shake - dt * 30);

    const sx = shake ? (Math.random() - 0.5) * shake : 0;
    ctx.save();
    ctx.translate(sx, 0);
    drawBackground();

    const anchor = topY();
    const visible = stack.length + (mover ? 1 : 0);
    for (let i = 0; i < stack.length; i++) {
      const b = stack[i];
      const depth = stack.length - 1 - i;
      const y = anchor + depth * (BLOCK_H + 2);
      if (y > H + 20) continue;
      const fade = y > H * 0.86 ? Math.max(0, 1 - (y - H * 0.86) / (H * 0.16)) : 1;
      drawBlock(b.x, y, b.w, BLOCK_H, colorAt(b.i), fade);
    }
    if (mover) drawBlock(mover.x, anchor - BLOCK_H - 2, mover.w, BLOCK_H, colorAt(mover.i), 1);

    shards.forEach(function (s) {
      ctx.save();
      ctx.translate(s.x + s.w / 2, s.y + s.h / 2);
      ctx.rotate(s.rot);
      drawBlock(-s.w / 2, -s.h / 2, s.w, s.h, s.c, 0.9);
      ctx.restore();
    });

    if (flash > 0) {
      ctx.globalAlpha = flash * 0.35;
      ctx.fillStyle = "#fff6e8";
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }

    var hud = 20 + (parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--sat")) || 0);
    label("KILN", hud + 18, 13, 700, "#e7b56a", 0.9);
    label(String(score), hud + 52, 42, 700, "#f4efe6", 1);
    label("BEST " + best, hud + 84, 13, 600, "#b7aa9a", 0.9);

    if (mode === "title") {
      ctx.fillStyle = "rgba(12,10,8,0.45)";
      ctx.fillRect(0, 0, W, H);
      label("KILN", H * 0.38, 54, 700, "#f4efe6");
      label("Tap to set each piece.", H * 0.38 + 48, 18, 500, "#e7d7c2");
      label("Line it up. A close drop keeps the full width.", H * 0.38 + 76, 15, 500, "#b7aa9a");
      label("Tap to start", H * 0.72, 18, 650, "#e7b56a");
    }

    if (mode === "over") {
      ctx.fillStyle = "rgba(12,10,8,0.55)";
      ctx.fillRect(0, H * 0.34, W, 180);
      label("Missed", H * 0.34 + 58, 36, 700);
      label(score + " placed", H * 0.34 + 100, 18, 500, "#e7d7c2");
      label("Tap to try again", H * 0.34 + 136, 16, 650, "#e7b56a");
    }

    ctx.restore();
    requestAnimationFrame(frame);
  }

  function tap() {
    unlockAudio();
    if (mode === "title" || mode === "over") reset();
    else drop();
  }

  window.addEventListener("resize", resize);
  if (window.visualViewport) window.visualViewport.addEventListener("resize", resize);
  window.addEventListener("orientationchange", function () { setTimeout(resize, 250); });
  window.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    tap();
  }, { passive: false });
  window.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });

  resize();
  const w = baseWidth();
  stack = [{ x: (W - w) / 2, w: w, i: 0 }];
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
