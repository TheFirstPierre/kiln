<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Kiln</title>
<style>
  :root {
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
  }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #100e0c;
    color: #f4efe6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100dvh;
    display: block;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const BEST_KEY = "kiln-best-v2";

  let dpr = 1;
  let W = 0;
  let H = 0;
  let safeTop = 0;
  let safeBottom = 0;

  let mode = "title";
  let pileIndex = 0;
  let shots = 3;
  let best = 0;
  let cleared = 0;
  let shake = 0;
  let last = 0;
  let audioOn = false;
  let actx = null;
  let camX = 0;
  let ground = 0;
  let boxes = [];
  let slug = null;
  let pull = null;
  let pointerId = null;
  let settleWait = 0;

  const G = 1700;
  const WORLD = 1280;
  const PILES = 3;

  try { best = Number(localStorage.getItem(BEST_KEY)) || 0; } catch (e) {}

  function resize() {
    var box = window.visualViewport;
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    W = Math.round(Math.max(window.innerWidth || 0, document.documentElement.clientWidth || 0, (box && box.width) || 0));
    H = Math.round(Math.max(window.innerHeight || 0, document.documentElement.clientHeight || 0, (box && box.height) || 0));
    if (W < 2) W = 2;
    if (H < 2) H = 2;
    canvas.style.position = "fixed";
    canvas.style.top = "0";
    canvas.style.left = "0";
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const s = getComputedStyle(document.documentElement);
    safeTop = parseFloat(s.getPropertyValue("--sat")) || 0;
    safeBottom = parseFloat(s.getPropertyValue("--sab")) || 0;
  }

  function tone(freq, dur, type, gain) {
    if (!audioOn || !actx) return;
    const t = actx.currentTime;
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g);
    g.connect(actx.destination);
    o.start(t);
    o.stop(t + dur);
  }

  function unlockAudio() {
    if (audioOn) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();
    audioOn = true;
    if (actx.state === "suspended") actx.resume();
  }

  function layout(index) {
    ground = H - 28 - safeBottom;
    const base = Math.max(460, Math.min(560, W * 0.95));
    const piles = [
      [
        [[24, 22, 26, 0]],
        [[8, 56, 32, 1]]
      ],
      [
        [[24, 18, 28, 0], [78, 46, 28, 0]],
        [[24, 18, 28, 0]],
        [[6, 52, 34, 1]]
      ],
      [
        [[24, 18, 26, 0], [86, 40, 26, 0]],
        [[24, 18, 26, 0]],
        [[24, 18, 26, 0]],
        [[8, 50, 36, 1]],
        [[18, 32, 22, 0]]
      ]
    ];
    boxes = [];
    let cursor = ground;
    piles[index].forEach(function (row) {
      let rowH = 0;
      row.forEach(function (b) { if (b[2] > rowH) rowH = b[2]; });
      const y = cursor - rowH;
      row.forEach(function (b) {
        boxes.push({
          x: base + b[0],
          y: y + (rowH - b[2]),
          w: b[1],
          h: b[2],
          vx: 0,
          vy: 0,
          target: b[3] === 1,
          downT: 0
        });
      });
      cursor = y - 2;
    });
    slug = {
      x: 176,
      y: ground - 96,
      r: 16,
      vx: 0,
      vy: 0,
      state: "ready"
    };
    pull = null;
    shots = 3;
    settleWait = 0;
    camX = 0;
  }

  function anchor() {
    return { x: 176, y: ground - 96 };
  }

  function speed(b) {
    return Math.hypot(b.vx, b.vy);
  }

  function pileCalm() {
    if (!slug || slug.state === "fly" || slug.state === "pull") return false;
    for (let i = 0; i < boxes.length; i++) {
      if (speed(boxes[i]) > 36) return false;
    }
    return true;
  }

  function targetBox() {
    for (let i = 0; i < boxes.length; i++) if (boxes[i].target) return boxes[i];
    return null;
  }

  function remember() {
    if (cleared > best) {
      best = cleared;
      try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {}
    }
  }

  function hitSound(sp) {
    shake = Math.min(14, 4 + sp / 180);
    tone(90 + Math.min(220, sp / 8), 0.09, "triangle", 0.07);
  }

  function resolveBoxes() {
    for (let n = 0; n < 4; n++) {
      for (let i = 0; i < boxes.length; i++) {
        for (let j = i + 1; j < boxes.length; j++) {
          const a = boxes[i];
          const b = boxes[j];
          const ox = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x);
          const oy = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
          if (ox <= 0 || oy <= 0) continue;
          if (ox < oy) {
            const dir = a.x < b.x ? -1 : 1;
            a.x += dir * ox * 0.5;
            b.x -= dir * ox * 0.5;
            const av = a.vx;
            a.vx = b.vx * 0.5;
            b.vx = av * 0.5;
          } else {
            const aAbove = a.y + a.h * 0.5 < b.y + b.h * 0.5;
            const top = aAbove ? a : b;
            const bot = aAbove ? b : a;
            top.y -= oy;
            if (top.vy > 0) top.vy = 0;
            if (bot.vy < 0) bot.vy = 0;
          }
        }
      }
    }
  }

  function slugHits() {
    if (!slug || slug.state !== "fly") return;
    for (let i = 0; i < boxes.length; i++) {
      const b = boxes[i];
      const cx = Math.max(b.x, Math.min(slug.x, b.x + b.w));
      const cy = Math.max(b.y, Math.min(slug.y, b.y + b.h));
      let nx = slug.x - cx;
      let ny = slug.y - cy;
      let d = Math.hypot(nx, ny);
      if (d > slug.r) continue;
      if (d < 0.001) {
        nx = 0;
        ny = -1;
        d = 1;
      }
      nx /= d;
      ny /= d;
      const pen = slug.r - d;
      slug.x += nx * (pen + 0.5);
      slug.y += ny * (pen + 0.5);
      const incoming = slug.vx;
      const vn = slug.vx * nx + slug.vy * ny;
      if (vn < 0) {
        slug.vx -= vn * nx;
        slug.vy -= vn * ny;
        const kick = Math.sign(incoming || nx) * Math.max(220, Math.abs(incoming) * 0.65);
        b.vx += kick;
        b.vy += ny * vn * -0.25;
        if (-vn > 140) hitSound(-vn);
      }
    }
  }

  function step(dt) {
    if (mode !== "play") return;
    const sub = 5;
    const h = dt / sub;
    for (let s = 0; s < sub; s++) {
      for (let i = 0; i < boxes.length; i++) {
        const b = boxes[i];
        b.vy += G * h;
        b.x += b.vx * h;
        b.y += b.vy * h;
        b.vx *= 0.998;
        if (b.y + b.h > ground) {
          b.y = ground - b.h;
          if (Math.abs(b.vy) < 80) b.vy = 0;
          else b.vy *= -0.12;
          b.vx *= 0.96;
          if (Math.abs(b.vx) < 14) b.vx = 0;
        }
      }
      resolveBoxes();
      if (slug && slug.state === "fly") {
        slug.vy += G * h;
        slug.x += slug.vx * h;
        slug.y += slug.vy * h;
        slugHits();
        if (slug.y + slug.r > ground) {
          slug.y = ground - slug.r;
          if (Math.abs(slug.vy) > 80) {
            hitSound(Math.abs(slug.vy));
            slug.vy *= -0.18;
          } else {
            slug.vy = 0;
            slug.vx *= 0.7;
          }
          if (speed(slug) < 40) {
            slug.vx = 0;
            slug.vy = 0;
            slug.state = "rest";
          }
        }
        if (slug.x < slug.r) { slug.x = slug.r; if (slug.vx < 0) slug.vx *= -0.2; }
        if (slug.x > WORLD - slug.r) { slug.x = WORLD - slug.r; slug.vx *= -0.2; }
      }
    }

    const t = targetBox();
    if (t) {
      const onGround = t.y + t.h >= ground - 1.5;
      if (onGround && speed(t) < 28) t.downT += dt;
      else t.downT = 0;
      if (t.downT > 0.45) {
        cleared = pileIndex + 1;
        remember();
        mode = pileIndex >= PILES - 1 ? "done" : "cleared";
        return;
      }
    }

    if (slug && slug.state === "rest") {
      settleWait += dt;
      if (settleWait > 0.35 && shots > 0) {
        const a = anchor();
        slug.x = a.x;
        slug.y = a.y;
        slug.vx = 0;
        slug.vy = 0;
        slug.state = "ready";
        settleWait = 0;
      }
    }

    if (shots <= 0 && pileCalm()) {
      const grounded = t && t.y + t.h >= ground - 1.5;
      if (!grounded) {
        settleWait += dt;
        if (settleWait > 0.55) mode = "lost";
      }
    }
  }

  function desiredCam() {
    if (!slug) return 0;
    const focus = slug.state === "ready" || slug.state === "pull" ? 0 : slug.x - W * 0.32;
    const max = Math.max(0, WORLD - W);
    return Math.max(0, Math.min(max, focus));
  }

  function roundRect(x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#1a1410");
    g.addColorStop(0.55, "#12100e");
    g.addColorStop(1, "#0c0b0a");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function drawWorld() {
    ctx.fillStyle = "#2a2118";
    ctx.fillRect(-40, ground, WORLD + 80, H - ground + 40);
    ctx.fillStyle = "#3a2c22";
    for (let x = 0; x < WORLD; x += 46) {
      ctx.fillRect(x, ground, 42, 8);
    }

    const a = anchor();
    ctx.strokeStyle = "#6a5c4e";
    ctx.lineWidth = 6;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(a.x - 28, ground);
    ctx.lineTo(a.x - 16, a.y + 8);
    ctx.moveTo(a.x + 28, ground);
    ctx.lineTo(a.x + 16, a.y + 8);
    ctx.stroke();

    const hold = slug && (slug.state === "pull" || slug.state === "ready");
    const tx = hold ? slug.x : a.x;
    const ty = hold ? slug.y : a.y;
    ctx.strokeStyle = "#cbb89a";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(a.x - 16, a.y + 8);
    ctx.lineTo(tx, ty);
    ctx.lineTo(a.x + 16, a.y + 8);
    ctx.stroke();

    boxes.forEach(function (b) {
      if (b.target) {
        ctx.fillStyle = "#e7d3a1";
        ctx.beginPath();
        ctx.moveTo(b.x + b.w / 2, b.y);
        ctx.lineTo(b.x + b.w, b.y + b.h);
        ctx.lineTo(b.x, b.y + b.h);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = "#8a5a38";
        ctx.lineWidth = 2;
        ctx.stroke();
      } else {
        ctx.fillStyle = "#7c4632";
        roundRect(b.x, b.y, b.w, b.h, 3);
        ctx.fill();
        ctx.fillStyle = "rgba(255,220,180,0.18)";
        ctx.fillRect(b.x + 3, b.y + 3, b.w - 6, 4);
      }
    });

    if (slug && slug.state !== "pocket") {
      const sg = ctx.createLinearGradient(slug.x - slug.r, slug.y - slug.r, slug.x + slug.r, slug.y + slug.r);
      sg.addColorStop(0, "#f7f1e4");
      sg.addColorStop(0.45, "#9fd7d2");
      sg.addColorStop(1, "#2f6f78");
      ctx.fillStyle = sg;
      ctx.beginPath();
      ctx.ellipse(slug.x, slug.y, slug.r * 1.35, slug.r * 0.82, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.55)";
      ctx.beginPath();
      ctx.ellipse(slug.x - 4, slug.y - 3, 5, 3, -0.4, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function label(text, y, size, weight, color, alpha) {
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    ctx.fillStyle = color || "#f4efe6";
    ctx.font = (weight || 600) + " " + size + "px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(text, W / 2, y);
    ctx.globalAlpha = 1;
  }

  function frame(ts) {
    var box = window.visualViewport;
    var liveW = Math.round(Math.max(window.innerWidth || 0, document.documentElement.clientWidth || 0, (box && box.width) || 0));
    var liveH = Math.round(Math.max(window.innerHeight || 0, document.documentElement.clientHeight || 0, (box && box.height) || 0));
    if (liveW !== W || liveH !== H) resize();
    const dt = Math.min(0.033, (ts - last) / 1000 || 0.016);
    last = ts;
    if (mode === "play") step(dt);
    if (shake > 0) shake = Math.max(0, shake - dt * 28);
    camX += (desiredCam() - camX) * Math.min(1, dt * 4);

    const sx = shake ? (Math.random() - 0.5) * shake : 0;
    ctx.save();
    ctx.translate(sx, 0);
    drawBackground();
    ctx.save();
    ctx.translate(-camX, 0);
    if (ground > 0) drawWorld();
    ctx.restore();

    var hud = 18 + safeTop;
    label("KILN", hud + 14, 13, 700, "#e7b56a", 0.9);
    if (mode !== "title") {
      label("PILE " + (pileIndex + 1) + "   SHOTS " + shots, hud + 40, 16, 650, "#f4efe6", 1);
      label("BEST " + best, hud + 64, 13, 600, "#b7aa9a", 0.9);
    } else {
      label("BEST " + best, hud + 40, 13, 600, "#b7aa9a", 0.9);
    }

    if (mode === "title") {
      ctx.fillStyle = "rgba(12,10,8,0.45)";
      ctx.fillRect(0, 0, W, H);
      label("KILN", H * 0.36, 54, 700, "#f4efe6");
      label("Pull the glass slug. Let go.", H * 0.36 + 48, 18, 500, "#e7d7c2");
      label("The pale cone has to hit the floor and stay there.", H * 0.36 + 76, 15, 500, "#b7aa9a");
      label("Three shots.", H * 0.36 + 102, 15, 500, "#b7aa9a");
      label("Tap to start", H * 0.72, 18, 650, "#e7b56a");
    }

    if (mode === "cleared") {
      ctx.fillStyle = "rgba(12,10,8,0.55)";
      ctx.fillRect(0, H * 0.34, W, 160);
      label("Down", H * 0.34 + 52, 36, 700);
      label("Tap for the next pile", H * 0.34 + 100, 16, 650, "#e7b56a");
    }

    if (mode === "done") {
      ctx.fillStyle = "rgba(12,10,8,0.55)";
      ctx.fillRect(0, H * 0.34, W, 170);
      label("All three down", H * 0.34 + 52, 32, 700);
      label("Best " + best, H * 0.34 + 96, 16, 500, "#e7d7c2");
      label("Tap to go again", H * 0.34 + 128, 16, 650, "#e7b56a");
    }

    if (mode === "lost") {
      ctx.fillStyle = "rgba(12,10,8,0.55)";
      ctx.fillRect(0, H * 0.34, W, 160);
      label("Still up", H * 0.34 + 52, 36, 700);
      label("Tap to try again", H * 0.34 + 100, 16, 650, "#e7b56a");
    }

    ctx.restore();
    requestAnimationFrame(frame);
  }

  function screenToWorld(e) {
    const r = canvas.getBoundingClientRect();
    const x = (e.clientX - r.left) * (W / r.width) + camX;
    const y = (e.clientY - r.top) * (H / r.height);
    return { x: x, y: y };
  }

  function beginPull(e) {
    if (!slug || slug.state !== "ready") return;
    pointerId = e.pointerId;
    pull = screenToWorld(e);
    slug.state = "pull";
  }

  function movePull(e) {
    if (slug.state !== "pull" || e.pointerId !== pointerId) return;
    const p = screenToWorld(e);
    const a = anchor();
    let dx = p.x - a.x;
    let dy = p.y - a.y;
    const len = Math.hypot(dx, dy) || 1;
    const max = 130;
    if (len > max) { dx *= max / len; dy *= max / len; }
    slug.x = a.x + dx;
    slug.y = a.y + dy;
  }

  function releasePull() {
    if (!slug || slug.state !== "pull") return;
    const a = anchor();
    const dx = slug.x - a.x;
    const dy = slug.y - a.y;
    const len = Math.hypot(dx, dy);
    pointerId = null;
    if (len < 16) {
      slug.x = a.x;
      slug.y = a.y;
      slug.state = "ready";
      return;
    }
    slug.vx = -dx * 9.4;
    slug.vy = -dy * 9.4;
    slug.state = "fly";
    shots -= 1;
    settleWait = 0;
    tone(240, 0.06, "sine", 0.05);
  }

  function startRun() {
    pileIndex = 0;
    cleared = 0;
    layout(0);
    mode = "play";
  }

  function onDown(e) {
    e.preventDefault();
    unlockAudio();
    if (mode === "title" || mode === "lost" || mode === "done") {
      startRun();
      return;
    }
    if (mode === "cleared") {
      pileIndex += 1;
      layout(pileIndex);
      mode = "play";
      return;
    }
    if (mode === "play") beginPull(e);
  }

  window.addEventListener("resize", resize);
  if (window.visualViewport) window.visualViewport.addEventListener("resize", resize);
  window.addEventListener("orientationchange", function () { setTimeout(resize, 250); });
  window.addEventListener("pointerdown", onDown, { passive: false });
  window.addEventListener("pointermove", function (e) {
    if (slug && slug.state === "pull") movePull(e);
  }, { passive: false });
  window.addEventListener("pointerup", function (e) {
    if (e.pointerId === pointerId) releasePull();
  });
  window.addEventListener("pointercancel", function (e) {
    if (e.pointerId === pointerId) releasePull();
  });
  window.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });

  resize();
  layout(0);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
